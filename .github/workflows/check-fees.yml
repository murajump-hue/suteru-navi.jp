name: 月次の料金ページ確認

on:
  schedule:
    # 毎月3日 4:17（日本時間）= 毎月2日 19:17（UTC）
    - cron: '17 19 2 * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 自治体の料金ページに変更がないか確認（変更があれば失敗して通知メールが届く）
        run: python scripts/check_updates.py
      - name: サイトが組み立てられるか確認
        run: |
          pip install -r requirements.txt
          python scripts/build_site.py
